<main class="logout-page">
  <section class="logout-card" aria-labelledby="logout-title">
    <a class="brand" routerLink="/login" aria-label="TaskOrbit sign in">
      <span class="brand-mark">T</span>
      <span>TaskOrbit</span>
    </a>

    <div class="status-icon" aria-hidden="true">
      <i class="pi pi-check"></i>
    </div>

    <h1 id="logout-title">You’re signed out</h1>
    <p>Your session has ended. Thanks for using TaskOrbit.</p>

    <a class="login-button" routerLink="/login">Sign in again</a>
    <span class="security-note">
      <i class="pi pi-lock" aria-hidden="true"></i>
      Your account is safe. You can close this page.
    </span>
  </section>
</main>
